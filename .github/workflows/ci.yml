name: offline-ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-python:
    name: Offline Python suites (Ubuntu, CPython 3.14)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan public history for secrets
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          curl --fail --location --silent --show-error \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "$RUNNER_TEMP/gitleaks.tar.gz"
          printf '%s  %s\n' '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' "$RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact=100 --log-opts=--all --config .gitleaks.toml .

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test.txt

      - name: Scan the public export
        run: python scripts/check-public-export.py

      - name: Run offline suites serially
        env:
          ADVISOR_RECEIPTS: ${{ runner.temp }}/advisor-receipts
        run: bash scripts/run-offline-tests.sh

  desktop:
    name: Desktop pane harness (Ubuntu, Node 26.x)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "26.x"
          cache: npm
          cache-dependency-path: tests/desktop/package-lock.json

      - name: Install Desktop test dependencies
        run: npm --prefix tests/desktop ci

      - name: Run Desktop pane tests
        run: npm --prefix tests/desktop test

      - name: Verify the generated Desktop plugin is current
        run: python3 scripts/build-desktop-plugin.py --check

      - name: Syntax-check the generated Desktop plugin
        run: node --check desktop/plugin.js

# The Desktop surface is experimental and Copy-only. These checks exercise the
# portable renderer harness and generated artifact, not native packaged-app
# acceptance; that evidence belongs to the Desktop lane's receipts.
